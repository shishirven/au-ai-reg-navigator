# One-shot: the agent token can read Actions but cannot call workflow_dispatch.
# Adding this file on main runs it, and the job dispatches "Deploy Cloud Run".
# Delete this file after that dispatch exists. A later commit that removes it
# does not re-run this workflow, because the file is no longer on main.
name: Dispatch Cloud Run deploy once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-cloudrun-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy Cloud Run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy Cloud Run" --repo "${{ github.repository }}" --ref main
