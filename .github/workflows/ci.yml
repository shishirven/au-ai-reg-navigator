name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  HF_HOME: ~/.cache/huggingface

jobs:
  checks:
    name: lint, types, tests, retrieval gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy regnav
      - name: Unit + integration tests (no network, no API key)
        run: uv run pytest --cov=regnav --cov-report=term-missing --cov-report=xml
      # Retrieval regression gate (real embedding model) is added in Phase 4.
