[project]
name = "regnav"
version = "0.1.0"
description = "AU AI Regulation Navigator: tier-aware RAG over Australian AI regulation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.70",
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "langfuse>=3.0",
    "mlflow>=2.14",
    "streamlit>=1.36",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
regnav = "regnav.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regnav"]

# CPU-only torch everywhere (dev, CI, Docker) - avoids multi-GB CUDA wheels.
[tool.uv]
# Only resolve for platforms we actually run on (dev laptops, CI, Docker).
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests/", "app/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not llm'"
markers = [
    "llm: needs a live Anthropic API key (adversarial / full eval); excluded by default",
    "integration: integration tests on the fixture corpus",
    "slow: loads a real embedding model",
]

[tool.coverage.run]
source = ["regnav"]
omit = ["regnav/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
