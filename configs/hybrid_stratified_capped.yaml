name: hybrid_stratified_capped
description: >-
  hybrid_stratified_rerank + two retrieval fixes (D-052): answer-format instructions are stripped
  before searching, and in the guidance tiers (regulator expectation, voluntary) each document is
  limited to 3 of the 4 slots (soft cap, from the top 40 re-ranked candidates) so one long document
  cannot crowd out the rest (F-12). The binding tier is left exactly as in
  hybrid_stratified_rerank: there the relevant standard should dominate (capping it removed needed
  CPS 230 paragraphs and lowered answer correctness). Playbook stage sub-queries are available
  (stage_queries) but off in Q&A (docs/stage_coverage.md).
seed: 42
embedding:
  backend: sentence_transformers
  model_name: BAAI/bge-small-en-v1.5
chunking:
  strategy: structural
retrieval:
  mode: stratified
  top_k: 12
  candidate_k: 40
  per_tier_k: 4
  rrf_k: 60
  sector_filter: true
  include_superseded: false
  query_expansion: true
  rerank: true
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_pool_k: 20
  per_doc_cap: 3
  per_doc_cap_tiers: [expectation, voluntary]
  tier_depth: 40
  strip_instructions: true
  stage_queries: false
  max_stages: 6
generation:
  # Groq free tier (key injected by the network proxy, or GROQ_API_KEY locally). See D-031.
  provider: groq
  model: qwen/qwen3.8-27b
  base_url: https://api.groq.com/openai/v1
  reasoning_effort: none   # Qwen thinking off: faster; whole token budget goes to the answer
  temperature: 0.0
  json_mode: none
  max_tokens: 900   # Groq free tier: output-tokens-per-minute limit is 1000 (D-038)
  max_validation_retries: 1
  max_claims_per_section: 3
  claim_repair: true
  scope_gate: true
  min_dense_similarity: 0.62
  price_input_per_mtok: 0.0   # free tier
  price_output_per_mtok: 0.0
  # Local fallback for the app/CLI when Groq is rate-limited or down (never used by evals). D-041.
  # In Docker, OLLAMA_BASE_URL (docker-compose.yml) points this at Ollama on the host.
  fallback:
    provider: ollama
    model: qwen3:4b
    base_url: http://localhost:11434
    temperature: 0.0
    num_ctx: 8192
    think: false
    json_mode: none
    max_tokens: 900
    timeout_s: 600
judge:
  # Different model family from the generator, to limit self-preference bias.
  provider: groq
  model: openai/gpt-oss-120b
  base_url: https://api.groq.com/openai/v1
  reasoning_effort: low
  temperature: 0.0
  json_mode: json
  max_tokens: 900   # judge outputs (incl. reasoning) peaked at ~600 tokens on the draft run
