name: baseline_dense
description: >-
  Naive baseline: dense (BGE) retrieval pooled across all documents, top-k.
seed: 42
embedding:
  backend: sentence_transformers
  model_name: BAAI/bge-small-en-v1.5
chunking:
  strategy: structural
retrieval:
  mode: dense
  top_k: 9
  candidate_k: 40
  per_tier_k: 3
  rrf_k: 60
  sector_filter: true
  include_superseded: false
generation:
  # Local, free: Qwen3 4B via Ollama (see README "Run on a laptop"). qwen3:8b is better but ~2x slower.
  provider: ollama
  model: qwen3:4b
  base_url: http://localhost:11434
  temperature: 0.0
  num_ctx: 8192
  think: false
  ollama_format: none
  max_tokens: 1500
  max_validation_retries: 1
  price_input_per_mtok: 0.0
  price_output_per_mtok: 0.0
judge:
  # Different model family from the generator, to limit self-preference bias.
  provider: ollama
  model: gemma3:4b
  base_url: http://localhost:11434
  temperature: 0.0
  num_ctx: 8192
  max_tokens: 800
