name: prod
description: >-
  Public-demo config (D-046). Same retrieval and generation thresholds as
  hybrid_stratified_rerank. The Ollama fallback is omitted: Cloud Run has no local
  model, and a Groq failure becomes the existing safe abstention. Retries and the
  HTTP timeout are shortened so one visitor cannot pin the process.
seed: 42
embedding:
  backend: sentence_transformers
  model_name: BAAI/bge-small-en-v1.5
chunking:
  strategy: structural
retrieval:
  mode: stratified
  top_k: 12
  candidate_k: 40
  per_tier_k: 4
  rrf_k: 60
  sector_filter: true
  include_superseded: false
  query_expansion: true
  rerank: true
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_pool_k: 20
generation:
  # Groq free tier only. Do not point this at a paid model.
  provider: groq
  model: qwen/qwen3.8-27b
  base_url: https://api.groq.com/openai/v1
  reasoning_effort: none
  temperature: 0.0
  json_mode: none
  max_tokens: 900
  max_rate_limit_retries: 1   # one retry, then safe abstention (D-046)
  timeout_s: 45
  max_validation_retries: 1
  max_claims_per_section: 3
  claim_repair: true
  scope_gate: true
  min_dense_similarity: 0.62
  price_input_per_mtok: 0.0
  price_output_per_mtok: 0.0
judge:
  # Evaluation only. The Cloud Run service never constructs the judge.
  provider: groq
  model: openai/gpt-oss-120b
  base_url: https://api.groq.com/openai/v1
  reasoning_effort: low
  temperature: 0.0
  json_mode: json
  max_tokens: 900
